[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./" }]

[rpc_endpoints]
base_mainnet = "https://mainnet.base.org"
reactive_mainnet = "https://mainnet-rpc.rnk.dev/"
ethereum_mainnet = "https://eth.llamarpc.com"
arbitrum_mainnet = "https://arb1.arbitrum.io/rpc"
bsc_mainnet = "https://binance.llamarpc.com"
avalanche_mainnet = "https://api.avax.network/ext/bc/C/rpc"

